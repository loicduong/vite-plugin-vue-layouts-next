  vite: $vite

catalog:
  '@antfu/eslint-config': ^8.2.0
  '@types/debug': ^4.1.13
  '@types/node': ^25.6.0
  '@vitejs/plugin-vue': ^6.0.6
  '@vue/compiler-sfc': ^3.5.33
  '@vue/server-renderer': ^3.5.33
  '@vueuse/head': ^2.0.0
  cross-env: ^10.1.0
  debug: ^4.4.3
  eslint: ^10.3.0
  fast-glob: ^3.3.3
  nodemon: ^3.1.14
  tsdown: ^0.21.10
  typescript: ^6.0.3
  unplugin-vue-markdown: ^30.0.0
  vite: ^8.0.10
  vite-plugin-inspect: ^11.3.3
  vite-plugin-pages: ^0.33.3
  vite-ssg: ^28.3.0
  vitest: ^4.1.5
  vue: ^3.5.33
  vue-router: ^5.0.6

onlyBuiltDependencies:
  - esbuild
