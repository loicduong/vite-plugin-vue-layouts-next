name: Docs

on:
  # Deploy only on release tags, matching the release workflow.
  push:
    tags:
      - '*'
  # Build (but never deploy) on PRs that touch the site or its dependencies,
  # so dead links and broken builds are caught before merge. `docs/superpowers`
  # is excluded from the site (`srcExclude`), so it is not a trigger.
  pull_request:
    paths:
      - docs/**
      - '!docs/superpowers/**'
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Runs pull-request code, so it stays read-only: no Pages credentials
    # are handed to a job that executes a contributor's install scripts and
    # docs config. Enabling Pages happens in `deploy`, which never runs on a
    # pull request.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm docs:build

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      # `enablement` turns Pages on through the API when the repository has
      # not had it enabled by hand yet.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v5
