name: Docs

on:
  # Deploy only on release tags, matching the release workflow.
  push:
    tags:
      - '*'
  # Build (but never deploy) on PRs, so dead links are caught before merge.
  pull_request:
    paths:
      - docs/**
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `enablement` below turns Pages on through the API when the repository
      # has not had it enabled by hand yet.
      pages: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm docs:build

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
