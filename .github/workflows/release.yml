name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    if: github.repository == 'loicduong/vite-plugin-vue-layouts-next'
    runs-on: ubuntu-latest
    # npm Trusted Publishing is bound to this workflow file + environment;
    # `id-token: write` mints the OIDC token, no NPM_TOKEN secret involved.
    environment: Release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A mistyped or hand-pushed tag must not publish package.json's version under
      # the wrong name: a published name/version can never be reused on npm.
      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Trusted Publishing needs npm >= 11.5 (Node 22 bundles npm 10)
      - run: npm i -g npm@^11

      - run: pnpm build

      # The release commit already holds this version's changelog entry at the top of
      # CHANGELOG.md; take everything up to the next version heading.
      - name: Release notes for this version
        run: |
          awk 'NR>1 && /^##? \[/{exit} {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      # `pnpm pack` writes the manifest with `catalog:` specifiers resolved;
      # `npm publish` on the tarball uses npm's OIDC Trusted Publishing (npm >= 11.5),
      # so no NODE_AUTH_TOKEN is involved and provenance is attached.
      - run: pnpm pack --out package.tgz

      # Skipped when this version is already on npm, so a rerun after a failure in a
      # later step (e.g. creating the GitHub release) can still complete the job.
      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if npm view "vite-plugin-vue-layouts-next@${TAG#v}" version >/dev/null 2>&1; then
            echo "vite-plugin-vue-layouts-next@${TAG#v} is already published, skipping"
          else
            npm publish package.tgz --provenance --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
