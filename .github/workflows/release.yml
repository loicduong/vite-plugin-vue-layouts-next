name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    if: github.repository == 'loicduong/vite-plugin-vue-layouts-next'
    runs-on: ubuntu-latest
    # npm Trusted Publishing is bound to this workflow file + environment;
    # `id-token: write` mints the OIDC token, no NPM_TOKEN secret involved.
    environment: Release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Trusted Publishing needs npm >= 11.5 (Node 22 bundles npm 10)
      - run: npm i -g npm@^11

      - run: pnpm build

      # The release commit already holds this version's changelog entry at the top of
      # CHANGELOG.md; take everything up to the next version heading.
      - name: Release notes for this version
        run: |
          awk 'NR>1 && /^##? \[/{exit} {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      # `pnpm pack` writes the manifest with `catalog:` specifiers resolved;
      # `npm publish` on the tarball uses npm's OIDC Trusted Publishing (npm >= 11.5),
      # so no NODE_AUTH_TOKEN is involved and provenance is attached.
      - run: pnpm pack --out package.tgz

      - run: npm publish package.tgz --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
